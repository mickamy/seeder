# seeder.yaml — example configuration tailored for the dogfood schema
# (`compose/init/postgres/schema.sql`: users, orders, comments).
#
# Auto-detected when present in the working directory, or pass
# --config <file> to point at one explicitly.
#
# Precedence: CLI flag > seeder.yaml > built-in default.

# Default rows per table (--rows on the command line wins and overrides
# per-table values below).
rows: 1000

# Default RNG seed (--seed on the command line wins). Leave unset for a
# time-based seed.
seed: 42

# TRUNCATE before insert (--truncate on the command line wins).
truncate: false

# Locale for inferred text values (en, ja, sv). --locale on the command line wins.
locale: en

# Per-table overrides.
tables:
  users:
    rows: 5000
    # Per-column overrides.
    # Use `generator` to force a built-in (supplying an unknown name surfaces
    # the full known list in the preflight error), or
    # `value` to pin a literal, or
    # `exclude` to skip the column.
    # Set exactly one of the two per column.
    columns:
      email:
        generator: Email
      bio:
        value: dogfood seed row
      deleted_at:
        exclude: true
  orders:
    rows: 10000
  comments:
    exclude: true
